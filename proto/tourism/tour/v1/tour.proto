syntax = "proto3";

package tourism.tour.v1;

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/pyroaktiv/soa-tourism/gateway/gen/go/tourism/tour/v1;tourv1";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Tour API";
    version: "0.1.0";
    description: "Tour management service";
  };
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
};

enum TourStatus {
  TOUR_STATUS_UNSPECIFIED = 0;
  TOUR_STATUS_DRAFT = 1;
  TOUR_STATUS_PUBLISHED = 2;
  TOUR_STATUS_ARCHIVED = 3;
}

enum TransportType {
  TRANSPORT_TYPE_UNSPECIFIED = 0;
  TRANSPORT_TYPE_FOOT = 1;
  TRANSPORT_TYPE_BICYCLE = 2;
  TRANSPORT_TYPE_CAR = 3;
}

message Keypoint {
  string name = 1;
  string description = 2;
  double latitude = 3;
  double longitude = 4;
  int32 order = 5;
  string image_url = 6;
}

message TransportTime {
  TransportType transport = 1;
  int32 minutes = 2;
}

message Review {
  string id = 1;
  string tourist_id = 2;
  string tourist_username = 3;
  int32 rating = 4;
  string comment = 5;
  string visit_date = 6;
  string created_at = 7;
  repeated string image_urls = 8;
}

message Tour {
  string id = 1;
  string author_id = 2;
  string name = 3;
  string description = 4;
  int32 difficulty = 5;
  repeated string tags = 6;
  TourStatus status = 7;
  double price = 8;
  double length_km = 9;
  string published_at = 10;
  string archived_at = 11;
  string created_at = 12;
  repeated Keypoint keypoints = 13;
  repeated TransportTime transport_times = 14;
  repeated Review reviews = 15;
}

message CreateTourRequest {
  string name = 1;
  string description = 2;
  int32 difficulty = 3;
  repeated string tags = 4;
}

message UpdateTourRequest {
  string id = 1;
  optional string name = 2;
  optional string description = 3;
  optional int32 difficulty = 4;
  repeated string tags = 5;
  optional double price = 6;
}

message GetTourRequest {
  string id = 1;
}

message ListMyToursRequest {}

message ListPublishedToursRequest {}

message ListToursResponse {
  repeated Tour tours = 1;
}

message AddKeypointRequest {
  string tour_id = 1;
  string name = 2;
  string description = 3;
  double latitude = 4;
  double longitude = 5;
  string image_url = 6;
}

message AddTransportTimeRequest {
  string tour_id = 1;
  TransportType transport = 2;
  int32 minutes = 3;
}

message PublishTourRequest {
  string id = 1;
}

message ArchiveTourRequest {
  string id = 1;
}

message ReactivateTourRequest {
  string id = 1;
}

message AddReviewRequest {
  string tour_id = 1;
  int32 rating = 2;
  string comment = 3;
  string visit_date = 4;
  repeated string image_urls = 5;
}

message UploadReviewImageRequest {
  bytes image_data = 1;
  string content_type = 2;
}

message UploadReviewImageResponse {
  string image_url = 1;
}

message UploadKeypointImageRequest {
  bytes image_data = 1;
  string content_type = 2;
}

message UploadKeypointImageResponse {
  string image_url = 1;
}

message UpdateKeypointRequest {
  string tour_id = 1;
  int32 order = 2;
  string name = 3;
  string description = 4;
  double latitude = 5;
  double longitude = 6;
  string image_url = 7;
}

message DeleteKeypointRequest {
  string tour_id = 1;
  int32 order = 2;
}

service TourService {
  rpc CreateTour(CreateTourRequest) returns (Tour) {
    option (google.api.http) = {
      post: "/api/v1/tours"
      body: "*"
    };
  }

  rpc UpdateTour(UpdateTourRequest) returns (Tour) {
    option (google.api.http) = {
      put: "/api/v1/tours/{id}"
      body: "*"
    };
  }

  rpc GetTour(GetTourRequest) returns (Tour) {
    option (google.api.http) = {
      get: "/api/v1/tours/{id}"
    };
  }

  rpc ListMyTours(ListMyToursRequest) returns (ListToursResponse) {
    option (google.api.http) = {
      get: "/api/v1/tours/authored"
    };
  }

  rpc ListPublishedTours(ListPublishedToursRequest) returns (ListToursResponse) {
    option (google.api.http) = {
      get: "/api/v1/tours"
    };
  }

  rpc AddKeypoint(AddKeypointRequest) returns (Tour) {
    option (google.api.http) = {
      post: "/api/v1/tours/{tour_id}/keypoints"
      body: "*"
    };
  }
  
  rpc UpdateKeypoint(UpdateKeypointRequest) returns (Tour) {
    option (google.api.http) = {
      put: "/api/v1/tours/{tour_id}/keypoints/{order}"
      body: "*"
    };
  }

  rpc DeleteKeypoint(DeleteKeypointRequest) returns (Tour) {
    option (google.api.http) = {
      delete: "/api/v1/tours/{tour_id}/keypoints/{order}"
    };
  }

  rpc AddTransportTime(AddTransportTimeRequest) returns (Tour) {
    option (google.api.http) = {
      post: "/api/v1/tours/{tour_id}/transport-times"
      body: "*"
    };
  }

  rpc PublishTour(PublishTourRequest) returns (Tour) {
    option (google.api.http) = {
      post: "/api/v1/tours/{id}/publish"
      body: "*"
    };
  }

  rpc ArchiveTour(ArchiveTourRequest) returns (Tour) {
    option (google.api.http) = {
      post: "/api/v1/tours/{id}/archive"
      body: "*"
    };
  }

  rpc ReactivateTour(ReactivateTourRequest) returns (Tour) {
    option (google.api.http) = {
      post: "/api/v1/tours/{id}/reactivate"
      body: "*"
    };
  }

  rpc AddReview(AddReviewRequest) returns (Tour) {
    option (google.api.http) = {
      post: "/api/v1/tours/{tour_id}/reviews"
      body: "*"
    };
  }

  rpc UploadReviewImage(UploadReviewImageRequest) returns (UploadReviewImageResponse) {
    option (google.api.http) = {
      post: "/api/v1/tours/reviews/images"
      body: "*"
    };
  }

  rpc UploadKeypointImage(UploadKeypointImageRequest) returns (UploadKeypointImageResponse) {
    option (google.api.http) = {
      post: "/api/v1/tours/keypoints/images"
      body: "*"
    };
  }
}
