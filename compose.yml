services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db

  nats:
    image: nats:alpine
    ports:
      - "4222:4222"
    expose:
      - "4222"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/varz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  saga-orchestrator:
    build:
      context: ./saga-orchestrator
      dockerfile: Dockerfile
    environment:
      NATS_URL: "nats://nats:4222"
    depends_on:
      nats:
        condition: service_started

  auth-service:
    build:
      context: ./auth
      dockerfile: Dockerfile
    environment:
      GRPC_ADDR: "0.0.0.0:9090"
      JWT_SECRET: "change-me"
      ACCESS_TOKEN_DURATION: "1h"
      REFRESH_TOKEN_DURATION: "168h"
      MONGO_URI: "mongodb://mongo:27017"
      MONGO_DB: "authdb"
      NATS_URL: "nats://nats:4222"
    expose:
      - "9090"
    depends_on:
      - mongo
      - nats

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: "server -filer -filer.port=8888 -ip=0.0.0.0"
    ports:
      - "8888:8888"
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  neo4j:
    image: neo4j:5
    restart: unless-stopped
    expose:
      - "7687"
    environment:
      NEO4J_AUTH: "neo4j/tourism-secret"
      NEO4J_server_memory_heap_initial__size: "256m"
      NEO4J_server_memory_heap_max__size: "512m"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  follower:
    build:
      context: ./follower
      dockerfile: Dockerfile
    environment:
      GRPC_ADDR: "0.0.0.0:9090"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "tourism-secret"
      AUTH_SERVICE_ADDR: "auth-service:9090"
    expose:
      - "9090"
    depends_on:
      neo4j:
        condition: service_healthy
      auth-service:
        condition: service_started

  stakeholders:
    build:
      context: ./stakeholders
      dockerfile: Dockerfile
    environment:
      GRPC_ADDR: "0.0.0.0:9090"
      MONGO_URI: "mongodb://mongo:27017"
      MONGO_DB: "stakeholdersdb"
      AUTH_SERVICE_ADDR: "auth-service:9090"
      SEAWEEDFS_FILER_URL: "http://seaweedfs:8888"
    expose:
      - "9090"
    depends_on:
      mongo:
        condition: service_started
      auth-service:
        condition: service_started
      seaweedfs:
        condition: service_started

  blog-service:
    build:
      context: .
      dockerfile: blog-service/Dockerfile
    environment:
      SPRING_DATA_MONGODB_URI: "mongodb://mongo:27017/blogdb"
      SPRING_DATA_MONGODB_HOST: "mongo"
      STAKEHOLDERS_SERVICE_ADDR: "stakeholders:9090"
      FOLLOWER_SERVICE_ADDR: "follower:9090"
    expose:
      - "8080"
      - "9090"
    depends_on:
      - mongo

  tour:
    build:
      context: ./tour
      dockerfile: Dockerfile
    environment:
      GRPC_ADDR: "0.0.0.0:9090"
      MONGO_URI: "mongodb://mongo:27017"
      MONGO_DB: "tourdb"
      AUTH_SERVICE_ADDR: "auth-service:9090"
      PAYMENT_SERVICE_ADDR: "payment:9090"
      SEAWEEDFS_FILER_URL: "http://seaweedfs:8888"
      NATS_URL: "nats://nats:4222"
    expose:
      - "9090"
    depends_on:
      - mongo
      - auth-service
      - seaweedfs
      - nats

  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    environment:
      GRPC_ADDR: "0.0.0.0:9090"
      MONGO_URI: "mongodb://mongo:27017"
      MONGO_DB: "simulatordb"
      AUTH_SERVICE_ADDR: "auth-service:9090"
    expose:
      - "9090"
    depends_on:
      - mongo
      - auth-service

  payment-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "payment"
      POSTGRES_PASSWORD: "payment"
      POSTGRES_DB: "paymentdb"
    expose:
      - "5432"
    volumes:
      - payment_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d paymentdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  payment:
    build:
      context: ./payment
      dockerfile: Dockerfile
    environment:
      GRPC_ADDR: "0.0.0.0:9090"
      POSTGRES_URI: "postgres://payment:payment@payment-db:5432/paymentdb?sslmode=disable"
      AUTH_SERVICE_ADDR: "auth-service:9090"
      TOUR_SERVICE_ADDR: "tour:9090"
      NATS_URL: "nats://nats:4222"
    expose:
      - "9090"
    depends_on:
      payment-db:
        condition: service_healthy
      auth-service:
        condition: service_started
      tour:
        condition: service_started
      nats:
        condition: service_started

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      AUTH_SERVICE_ADDR: "auth-service:9090"
      STAKEHOLDERS_SERVICE_ADDR: "stakeholders:9090"
      FOLLOWER_SERVICE_ADDR: "follower:9090"
      BLOG_SERVICE_ADDR: "blog-service:9090"
      TOUR_SERVICE_ADDR: "tour:9090"
      PAYMENT_SERVICE_ADDR: "payment:9090"
      CORS_ALLOWED_ORIGINS: "*"
    depends_on:
      - auth-service
      - stakeholders
      - follower
      - blog-service
      - tour
      - payment

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SEAWEEDFS_URL=http://localhost:8888
        - NEXT_PUBLIC_API_URL=http://localhost:8080/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - gateway

volumes:
  mongo_data:
  seaweedfs_data:
  neo4j_data:
  payment_data:
