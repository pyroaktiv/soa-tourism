services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db

  nats:
    image: nats:alpine
    ports:
      - "4222:4222"
    expose:
      - "4222"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/varz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  saga-orchestrator:
    build:
      context: ./saga-orchestrator
      dockerfile: Dockerfile
    environment:
      NATS_URL: "nats://nats:4222"
    depends_on:
      nats:
        condition: service_started

  auth-service:
    build:
      context: ./auth
      dockerfile: Dockerfile
    environment:
      GRPC_ADDR: "0.0.0.0:9090"
      JWT_SECRET: "change-me"
      ACCESS_TOKEN_DURATION: "1h"
      REFRESH_TOKEN_DURATION: "168h"
      MONGO_URI: "mongodb://mongo:27017"
      MONGO_DB: "authdb"
      NATS_URL: "nats://nats:4222"
    expose:
      - "9090"
    depends_on:
      - mongo
      - nats

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: "server -filer -filer.port=8888 -ip=0.0.0.0"
    ports:
      - "8888:8888"
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  neo4j:
    image: neo4j:5
    restart: unless-stopped
    expose:
      - "7687"
    environment:
      NEO4J_AUTH: "neo4j/tourism-secret"
      NEO4J_server_memory_heap_initial__size: "256m"
      NEO4J_server_memory_heap_max__size: "512m"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  follower:
    build:
      context: ./follower
      dockerfile: Dockerfile
    environment:
      GRPC_ADDR: "0.0.0.0:9090"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "tourism-secret"
      AUTH_SERVICE_ADDR: "auth-service:9090"
    expose:
      - "9090"
    depends_on:
      neo4j:
        condition: service_healthy
      auth-service:
        condition: service_started

  stakeholders:
    build:
      context: ./stakeholders
      dockerfile: Dockerfile
    environment:
      GRPC_ADDR: "0.0.0.0:9090"
      MONGO_URI: "mongodb://mongo:27017"
      MONGO_DB: "stakeholdersdb"
      AUTH_SERVICE_ADDR: "auth-service:9090"
      SEAWEEDFS_FILER_URL: "http://seaweedfs:8888"
    expose:
      - "9090"
    depends_on:
      mongo:
        condition: service_started
      auth-service:
        condition: service_started
      seaweedfs:
        condition: service_started

  blog-service:
    build:
      context: .
      dockerfile: blog-service/Dockerfile
    environment:
      SPRING_DATA_MONGODB_URI: "mongodb://mongo:27017/blogdb"
      SPRING_DATA_MONGODB_HOST: "mongo"
      STAKEHOLDERS_SERVICE_ADDR: "stakeholders:9090"
      FOLLOWER_SERVICE_ADDR: "follower:9090"
    expose:
      - "8080"
      - "9090"
    depends_on:
      - mongo

  tour:
    build:
      context: ./tour
      dockerfile: Dockerfile
    environment:
      GRPC_ADDR: "0.0.0.0:9090"
      MONGO_URI: "mongodb://mongo:27017"
      MONGO_DB: "tourdb"
      AUTH_SERVICE_ADDR: "auth-service:9090"
      PAYMENT_SERVICE_ADDR: "payment:9090"
      SEAWEEDFS_FILER_URL: "http://seaweedfs:8888"
      OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector:4317"
      NATS_URL: "nats://nats:4222"
    expose:
      - "9090"
    depends_on:
      - mongo
      - auth-service
      - seaweedfs
      - otel-collector
      - nats

  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    environment:
      GRPC_ADDR: "0.0.0.0:9090"
      MONGO_URI: "mongodb://mongo:27017"
      MONGO_DB: "simulatordb"
      AUTH_SERVICE_ADDR: "auth-service:9090"
    expose:
      - "9090"
    depends_on:
      - mongo
      - auth-service

  payment-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "payment"
      POSTGRES_PASSWORD: "payment"
      POSTGRES_DB: "paymentdb"
    expose:
      - "5432"
    volumes:
      - payment_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d paymentdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  payment:
    build:
      context: ./payment
      dockerfile: Dockerfile
    environment:
      GRPC_ADDR: "0.0.0.0:9090"
      POSTGRES_URI: "postgres://payment:payment@payment-db:5432/paymentdb?sslmode=disable"
      AUTH_SERVICE_ADDR: "auth-service:9090"
      TOUR_SERVICE_ADDR: "tour:9090"
      NATS_URL: "nats://nats:4222"
    expose:
      - "9090"
    depends_on:
      payment-db:
        condition: service_healthy
      auth-service:
        condition: service_started
      tour:
        condition: service_started
      nats:
        condition: service_started

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      AUTH_SERVICE_ADDR: "auth-service:9090"
      STAKEHOLDERS_SERVICE_ADDR: "stakeholders:9090"
      FOLLOWER_SERVICE_ADDR: "follower:9090"
      BLOG_SERVICE_ADDR: "blog-service:9090"
      TOUR_SERVICE_ADDR: "tour:9090"
      PAYMENT_SERVICE_ADDR: "payment:9090"
      CORS_ALLOWED_ORIGINS: "*"
      OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector:4317"
    depends_on:
      - auth-service
      - stakeholders
      - follower
      - blog-service
      - tour
      - otel-collector
      - payment

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SEAWEEDFS_URL=http://localhost:8888
        - NEXT_PUBLIC_API_URL=http://localhost:8080/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - gateway

  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    pid: "host"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    expose:
      - "9100"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    expose:
      - "8080"

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
    depends_on:
      - node-exporter
      - cadvisor
      - otel-collector

  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    expose:
      - "3100"
    volumes:
      - ./monitoring/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/loki.yml

  promtail:
    image: grafana/promtail:latest
    restart: unless-stopped
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./monitoring/promtail.yml:/etc/promtail/promtail.yml:ro
    command: -config.file=/etc/promtail/promtail.yml
    depends_on:
      - loki

  tempo:
    image: grafana/tempo:latest
    restart: unless-stopped
    expose:
      - "3200"
      - "4317"
    volumes:
      - ./monitoring/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    command: -config.file=/etc/tempo/tempo.yml

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: unless-stopped
    expose:
      - "4317"
      - "8889"
    volumes:
      - ./monitoring/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    depends_on:
      - tempo

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      # GF_LOG_LEVEL: "debug"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  mongo_data:
  seaweedfs_data:
  neo4j_data:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:
  payment_data:
